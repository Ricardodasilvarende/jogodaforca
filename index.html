<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Jogo da Forca</h1>

        <div class="game-info">
            <p>Dica: <span id="category-tip"></span></p>
            <p>Erros: <span id="wrong-count">0</span> / 6</p>
        </div>

        <div class="word-display" id="word-display">
            <!-- Letras da palavra entram aqui -->
        </div>

        <div class="keyboard" id="keyboard">
            <!-- Botões do teclado virtual -->
        </div>

        <button id="restart-btn" class="hidden">Jogar Novamente</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
